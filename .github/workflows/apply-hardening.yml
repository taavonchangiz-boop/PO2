          write('public/assets/css/uiux-hardening.css', css)

          js = r'''(function(){'use strict';
          function csrf(){var el=document.querySelector('input[name="csrf_token"]');return el?el.value:'';}
          var originalFetch=window.fetch;
          if(originalFetch&&!window.__postyarFetchHardened){
            window.__postyarFetchHardened=true;
            window.fetch=function(input,init){init=init||{};var method=(init.method||(input&&input.method)||'GET').toUpperCase();if(['POST','PUT','PATCH','DELETE'].indexOf(method)>=0){var h=new Headers(init.headers||{}),token=csrf();if(token&&!h.has('X-CSRF-Token'))h.set('X-CSRF-Token',token);init.headers=h;}return originalFetch.call(this,input,init);};
          }
          document.addEventListener('submit',function(e){var f=e.target;if(!f||f.dataset.doubleSubmitGuard==='off')return;var b=f.querySelector('[type="submit"]');if(b){if(b.dataset.busy==='1'){e.preventDefault();return;}b.dataset.busy='1';b.classList.add('ui-busy');b.setAttribute('aria-disabled','true');}},true);
          function offline(){var b=document.querySelector('.ui-offline-banner');if(!b){b=document.createElement('div');b.className='ui-offline-banner';b.setAttribute('role','status');b.textContent='اتصال اینترنت قطع شده است. پس از برقراری اتصال دوباره تلاش کنید.';document.body.appendChild(b);}b.classList.toggle('is-visible',!navigator.onLine);}
          window.addEventListener('online',offline);window.addEventListener('offline',offline);document.addEventListener('DOMContentLoaded',offline);
          document.addEventListener('DOMContentLoaded',function(){if(!document.querySelector('meta[name="viewport"]')){var m=document.createElement('meta');m.name='viewport';m.content='width=device-width,initial-scale=1,viewport-fit=cover';document.head.appendChild(m);}document.querySelectorAll('button:not([aria-label]):not([aria-labelledby])').forEach(function(b){if(!b.textContent.trim()){var t=b.title;if(t)b.setAttribute('aria-label',t);}});});
