                          $claimIdentity=$platform."\0".$channelId; $owner=AntiAbuse::claimOwner($db,'channel',$claimIdentity);
                          if($owner!==null && $owner!==$tenantId) throw new \RuntimeException('این شناسه کانال قبلاً توسط کاربر دیگری استفاده شده است.');
                          if($owner===null && !AntiAbuse::claimChannel($db,$tenantId,$platform,$channelId)) throw new \RuntimeException('این شناسه کانال همزمان توسط حساب دیگری Claim شد.');
                          $stmt=$db->prepare('SELECT owner_user_id FROM channel_registry WHERE platform=? AND channel_id=? LIMIT 1'); $stmt->execute([$platform,$channelId]); $reg=$stmt->fetch();
