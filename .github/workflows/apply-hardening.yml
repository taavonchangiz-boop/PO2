                  [$jy,$jm,$jd]=array_map('intval',explode('/',$raw)); if($jy<1300||$jm<1||$jm>12||$jd<1||$jd>31){$this->setFlashMessage('تاریخ زمان‌بندی نامعتبر است.');$this->redirect('/dashboard');}
                  $hour=(int)($_POST['sched_hour']??0); $minute=(int)($_POST['sched_minute']??0); if($hour<0||$hour>23||$minute<0||$minute>59){$this->setFlashMessage('ساعت زمان‌بندی نامعتبر است.');$this->redirect('/dashboard');}
                  $g=self::jalaliToGregorian($jy,$jm,$jd); $scheduled_at=sprintf('%04d-%02d-%02d %02d:%02d:00',$g['year'],$g['month'],$g['day'],$hour,$minute);
                  if(strtotime($scheduled_at)<=time()+60){$this->setFlashMessage('زمان‌بندی باید حداقل یک دقیقه در آینده باشد.');$this->redirect('/dashboard');}
              }
