          # Add CSRF to notification AJAX methods that mutate state.
          for name in ['handleMarkAnnouncementRead','handleMarkNotificationRead','handleMarkAllNotificationsRead']:
              pat = rf'(public function {name}\(\)\s*\{{\s*header\([^;]+;\s*\$this->checkAuth\(\);)'
