                  $q=$db->prepare('SELECT id FROM settings WHERE tenant_id=0 AND key_name=? LIMIT 1');$q->execute([$f]);
                  if($q->fetch()){$db->prepare('UPDATE settings SET key_value=? WHERE tenant_id=0 AND key_name=?')->execute([$val,$f]);}
