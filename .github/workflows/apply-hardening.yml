      - name: PHP syntax validation
        shell: bash
        run: |
          set -e
          find postyar-private -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build deployment archive
        shell: bash
        run: |
          set -e
          rm -rf /tmp/postyar-package
          mkdir -p /tmp/postyar-package
          rsync -a --exclude='.git' --exclude='storage/logs/*' --exclude='storage/cache/*' ./ /tmp/postyar-package/PO2/
          cd /tmp/postyar-package
          zip -qr /tmp/PO2-hardened.zip PO2

      - name: Upload deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: PO2-hardened
          path: /tmp/PO2-hardened.zip
          retention-days: 7

      - name: Commit transformed project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -f .github/workflows/apply-hardening.yml
          git config user.name 'OpenAI Hardening Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'security: apply complete hardening and mobile UX pass' || exit 0
          git push origin HEAD:hardening/uiux-complete-2026-08
