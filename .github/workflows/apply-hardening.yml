              main, n = re.subn(pat, repl, main, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f'Missing CSRF insertion point: {name}')

          write('app/Controllers/MainController.php', main)

          # 5) Upload memory/decoder bomb protection.
          base = read('app/Controllers/BaseController.php')
          marker = "        // ---- ۶. تبدیل به WebP ----\n        $image = null;"
          if marker in base and 'MAX_IMAGE_PIXELS' not in base:
              inject = r'''        // ---- ۶. محدودیت ابعاد تصویر قبل از Decode (جلوگیری از decompression bomb) ----
              $MAX_IMAGE_PIXELS = 20_000_000;
              $imageInfo = @getimagesize($_FILES[$file_input_name]['tmp_name']);
              if (!$imageInfo || (($imageInfo[0] ?? 0) * ($imageInfo[1] ?? 0)) > $MAX_IMAGE_PIXELS) {
                  $this->setFlashMessage('ابعاد تصویر بیش از حد مجاز است.');
                  return '';
              }

              // ---- ۷. تبدیل به WebP ----
              $image = null;'''
              base=base.replace(marker,inject,1)
          write('app/Controllers/BaseController.php', base)

          # 6) SMTP password is encrypted at rest and decrypted only immediately before PHPMailer use.
          email = read('app/Core/EmailTemplate.php')
          if "SecretStore::decrypt" not in email:
              email=email.replace("$settings[$key] = $row !== false ? $row['key_value'] : '';", "$settings[$key] = $row !== false ? $row['key_value'] : '';\n            if ($key === 'smtp_password' && $settings[$key] !== '') { $settings[$key] = SecretStore::decrypt((string)$settings[$key]); }")
              email=email.replace("namespace WHCM\\Core;", "namespace WHCM\\Core;\n\nuse WHCM\\Core\\SecretStore;", 1)
          write('app/Core/EmailTemplate.php', email)

          # 7) AdSales concurrency: lock placement rows before max_concurrent decision on MySQL.
          ads=read('app/Domain/AdSales.php')
          needle="            foreach($campaignPlacements as $cp) {\n"
          if needle in ads and 'FOR UPDATE' not in ads[ads.find(needle):ads.find(needle)+1000]:
              ads=ads.replace(needle, "            $lockedPlacements=[];\n            foreach($campaignPlacements as $cp) {\n                if($driver==='mysql'){ $lock=$db->prepare('SELECT id FROM ad_placements WHERE id=? FOR UPDATE'); $lock->execute([(int)$cp['placement_id']]); $lockedPlacements[]=(int)$cp['placement_id']; }\n", 1)
          write('app/Domain/AdSales.php', ads)

          # 8) Design System + mobile/tablet UX hardening.
          css = r''':root{
            --ui-space-1:.25rem;--ui-space-2:.5rem;--ui-space-3:.75rem;--ui-space-4:1rem;--ui-space-5:1.25rem;--ui-space-6:1.5rem;
            --ui-radius-sm:8px;--ui-radius-md:12px;--ui-radius-lg:16px;
            --ui-focus:0 0 0 3px rgba(37,99,235,.24);
