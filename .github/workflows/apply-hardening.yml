name: Apply Security and UX Hardening

on:
  push:
    branches:
      - hardening/uiux-complete-2026-08

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('postyar-private')

          def read(p):
              return (ROOT / p).read_text(encoding='utf-8')
          def write(p, s):
              (ROOT / p).write_text(s, encoding='utf-8')

          def replace_between(text, start_re, end_re, replacement, label):
              m = re.search(start_re, text, re.M)
              if not m:
                  raise RuntimeError(f'Missing start marker: {label}')
              e = re.search(end_re, text[m.end():], re.M)
              if not e:
                  raise RuntimeError(f'Missing end marker: {label}')
              a = m.start(); b = m.end() + e.start()
              return text[:a] + replacement.rstrip() + '\n\n' + text[b:]

          # 1) WebPush: strict endpoint validation + DNS pinning + no redirect + bounded TTL.
          webpush = r'''<?php
          namespace WHCM\Core;

          /**
           * Web Push transport with strict SSRF protection.
           * The endpoint is user-controlled data and is therefore never trusted.
           */
          final class WebPush {
              public static function send(string $endpoint, string $userPublicKey, string $userAuthToken, string $payload, array $vapid, int $ttl = 2419200): array {
                  $target = self::validateEndpoint($endpoint);
                  $ttl = max(0, min($ttl, 2419200));
                  $headers = [
                      'TTL: ' . $ttl,
                      'Content-Type: application/octet-stream',
                      'Content-Encoding: aes128gcm',
                  ];

                  if (!empty($vapid['subject']) && !empty($vapid['publicKey']) && !empty($vapid['privateKey'])) {
                      $headers[] = 'Authorization: ' . self::createVapidAuthorization($target['audience'], $vapid['subject'], $vapid['publicKey'], $vapid['privateKey']);
                  }

                  $encrypted = self::encryptPayload($payload, $userPublicKey, $userAuthToken);
                  $headers[] = 'Content-Length: ' . strlen($encrypted);

                  $ch = curl_init($endpoint);
                  if ($ch === false) throw new \RuntimeException('Web Push transport initialization failed.');
                  curl_setopt_array($ch, [
                      CURLOPT_POST => true,
                      CURLOPT_RETURNTRANSFER => true,
                      CURLOPT_HTTPHEADER => $headers,
                      CURLOPT_POSTFIELDS => $encrypted,
                      CURLOPT_TIMEOUT => 30,
                      CURLOPT_CONNECTTIMEOUT => 10,
                      CURLOPT_FOLLOWLOCATION => false,
                      CURLOPT_MAXREDIRS => 0,
                      CURLOPT_SSL_VERIFYPEER => true,
                      CURLOPT_SSL_VERIFYHOST => 2,
                      CURLOPT_PROTOCOLS => CURLPROTO_HTTPS,
                      CURLOPT_REDIR_PROTOCOLS => CURLPROTO_HTTPS,
                      CURLOPT_RESOLVE => $target['resolve'],
                  ]);
                  $response = curl_exec($ch);
                  $statusCode = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
                  $curlError = curl_error($ch);
                  curl_close($ch);

                  return ['success' => ($statusCode >= 200 && $statusCode < 300), 'status' => $statusCode, 'error' => $curlError ?: null];
              }

              public static function sendBatch(array $subscriptions, string $payload, array $vapid): array {
                  $results = [];
                  foreach ($subscriptions as $sub) {
                      try {
                          $results[] = self::send((string)$sub['endpoint'], (string)$sub['keys_p256dh'], (string)$sub['keys_auth'], $payload, $vapid);
                      } catch (\Throwable $e) {
                          $results[] = ['success' => false, 'status' => 0, 'error' => $e->getMessage()];
                      }
                  }
                  return $results;
              }

              private static function validateEndpoint(string $endpoint): array {
                  $parts = parse_url(trim($endpoint));
                  if (!$parts || strtolower((string)($parts['scheme'] ?? '')) !== 'https' || empty($parts['host'])) {
                      throw new \InvalidArgumentException('Push endpoint must use HTTPS.');
                  }
                  if (isset($parts['user']) || isset($parts['pass'])) throw new \InvalidArgumentException('Push endpoint credentials are not allowed.');
                  $host = strtolower(rtrim((string)$parts['host'], '.'));
                  $port = (int)($parts['port'] ?? 443);
                  if ($port !== 443) throw new \InvalidArgumentException('Push endpoint port is not allowed.');
                  if ($host === 'localhost' || str_ends_with($host, '.localhost') || str_ends_with($host, '.local')) throw new \InvalidArgumentException('Private push endpoint is not allowed.');

                  $ips = [];
                  if (filter_var($host, FILTER_VALIDATE_IP)) {
                      $ips = [$host];
                  } else {
                      $a = @dns_get_record($host, DNS_A);
                      $aaaa = @dns_get_record($host, DNS_AAAA);
                      foreach (array_merge(is_array($a) ? $a : [], is_array($aaaa) ? $aaaa : []) as $r) {
                          if (!empty($r['ip'])) $ips[] = $r['ip'];
                          if (!empty($r['ipv6'])) $ips[] = $r['ipv6'];
                      }
                  }
                  $ips = array_values(array_unique($ips));
                  if (!$ips) throw new \RuntimeException('Push endpoint DNS resolution failed.');
                  foreach ($ips as $ip) {
                      if (filter_var($ip, FILTER_VALIDATE_IP, FILTER_FLAG_NO_PRIV_RANGE | FILTER_FLAG_NO_RES_RANGE) === false) {
                          throw new \InvalidArgumentException('Push endpoint resolves to a private or reserved address.');
                      }
                  }
                  $resolve = [];
                  foreach ($ips as $ip) {
                      $resolve[] = str_contains($ip, ':') ? $host . ':443:[' . $ip . ']' : $host . ':443:' . $ip;
                  }
                  return ['audience' => 'https://' . $host, 'resolve' => $resolve];
              }

              private static function createVapidAuthorization(string $audience, string $subject, string $publicKey, string $privateKeyPem): string {
                  return 'vapid t=' . self::buildVapidJwt($audience, $subject, $privateKeyPem) . ', k=' . $publicKey;
              }
              private static function buildVapidJwt(string $audience, string $subject, string $privateKeyPem): string {
                  $h = self::b64UrlEncode(json_encode(['typ'=>'JWT','alg'=>'ES256'], JSON_UNESCAPED_SLASHES));
                  $b = self::b64UrlEncode(json_encode(['aud'=>$audience,'exp'=>time()+43200,'sub'=>$subject], JSON_UNESCAPED_SLASHES));
                  $unsigned = $h . '.' . $b;
                  $pkey = openssl_pkey_get_private($privateKeyPem);
                  if (!$pkey || !openssl_sign($unsigned, $signature, $pkey, OPENSSL_ALGO_SHA256)) throw new \RuntimeException('VAPID signing failed.');
                  return $unsigned . '.' . self::b64UrlEncode($signature);
              }

              private static function encryptPayload(string $payload, string $userPubKeyB64, string $userAuthB64): string {
                  $userPubKey = self::b64UrlDecode($userPubKeyB64); $userAuth = self::b64UrlDecode($userAuthB64);
                  if (strlen($userPubKey) !== 65 || strlen($userAuth) < 16) throw new \InvalidArgumentException('Invalid Web Push subscription keys.');
                  $ephemKey = openssl_pkey_new(['curve_name'=>'prime256v1','private_key_type'=>OPENSSL_KEYTYPE_EC]);
                  if (!$ephemKey) throw new \RuntimeException('Ephemeral key generation failed.');
                  $details = openssl_pkey_get_details($ephemKey); if (!$details || empty($details['key'])) throw new \RuntimeException('Ephemeral public key extraction failed.');
                  $ephemPubRaw = self::extractRawPoint($details);
                  $sharedSecret = self::ecdh($ephemKey, $userPubKey);
                  $prk = hash_hmac('sha256', $sharedSecret, $userAuth, true);
                  $info = "Content-Encoding: aes128gcm\x00P-256\x00" . self::u16(strlen($ephemPubRaw)) . $ephemPubRaw . self::u16(strlen($userPubKey)) . $userPubKey;
                  $cek = substr(hash_hmac('sha256', $info . "\x01", $prk, true), 0, 16);
                  $nonce = substr(hash_hmac('sha256', $info . "\x02", $prk, true), 0, 12);
                  $tag=''; $ciphertext=openssl_encrypt($payload,'aes-128-gcm',$cek,OPENSSL_RAW_DATA,$nonce,$tag, '', 16);
                  if ($ciphertext === false) throw new \RuntimeException('Push encryption failed.');
                  return $ephemPubRaw . "\x00\x00" . $ciphertext . $tag;
              }
              private static function ecdh($localKey, string $remotePubRaw): string {
                  $remotePem=self::rawPointToSpkiPem($remotePubRaw); $remoteKey=openssl_pkey_get_public($remotePem);
                  if (!$remoteKey) throw new \RuntimeException('Remote public key error.');
                  $result=openssl_dh_compute_key($remoteKey,$localKey); if ($result===false) throw new \RuntimeException('ECDH compute failed.');
                  return str_pad($result,32,"\x00",STR_PAD_LEFT);
              }
              private static function b64UrlEncode(string $data): string { return rtrim(strtr(base64_encode($data),'+/','-_'),'='); }
              private static function b64UrlDecode(string $data): string { $data=strtr($data,'-_','+/'); $pad=(4-strlen($data)%4)%4; return base64_decode($data . str_repeat('=',$pad),true) ?: ''; }
              private static function u16(int $n): string { return chr(($n>>8)&255).chr($n&255); }
              private static function extractRawPoint(array $details): string {
                  $der=base64_decode(preg_replace('/-----.*?-----/','',$details['key'])); $pos=strrpos($der,"\x04");
                  if ($pos===false || $pos+65>strlen($der)) throw new \RuntimeException('Cannot extract EC public point.'); return substr($der,$pos,65);
              }
              private static function rawPointToSpkiPem(string $point): string {
                  $oid=hex2bin('06082a8648ce3d030107'); $bit="\x03".chr(1+strlen($point))."\x00".$point; $content=$oid.$bit; $len=strlen($content);
                  $seq="\x30".($len<128?chr($len):chr(0x81).chr($len)).$content;
                  return "-----BEGIN PUBLIC KEY-----\n".chunk_split(base64_encode($seq),64)."-----END PUBLIC KEY-----";
              }
          }
          '''
          write('app/Core/WebPush.php', webpush)

          # 2) HTTP egress: HTTPS-only, DNS pinning, no redirects, public-address policy.
          http = read('app/Core/HttpClient.php')
          marker = "        $method = strtoupper($method);"
          if "private static function validateOutboundUrl" not in http:
              http = http.replace(marker, marker + r'''

          if (!self::validateOutboundUrl($url)) {
              return ['success'=>false,'code'=>0,'body'=>'','error'=>'نشانی مقصد خارجی مجاز نیست.'];
          }
          ''', 1)
              http = http.replace("        curl_setopt($ch, CURLOPT_CUSTOMREQUEST, $method);", "        curl_setopt($ch, CURLOPT_CUSTOMREQUEST, $method);\n        curl_setopt($ch, CURLOPT_FOLLOWLOCATION, false);\n        curl_setopt($ch, CURLOPT_MAXREDIRS, 0);\n        curl_setopt($ch, CURLOPT_PROTOCOLS, CURLPROTO_HTTPS);\n        curl_setopt($ch, CURLOPT_REDIR_PROTOCOLS, CURLPROTO_HTTPS);", 1)
              http = http.replace("        curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 2);", "        curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 2);\n        $pin = self::dnsResolvePublic($url);\n        if ($pin) curl_setopt($ch, CURLOPT_RESOLVE, $pin);", 1)
              insertion = r'''

      private static function validateOutboundUrl(string $url): bool {
          $p=parse_url(trim($url));
          if(!$p || strtolower((string)($p['scheme']??''))!=='https' || empty($p['host']) || isset($p['user']) || isset($p['pass'])) return false;
          $port=(int)($p['port']??443); if($port!==443) return false;
          $host=strtolower(rtrim((string)$p['host'],'.'));
          if($host==='localhost'||str_ends_with($host,'.localhost')||str_ends_with($host,'.local')) return false;
          $ips=self::resolveHost($host); if(!$ips) return false;
          foreach($ips as $ip) if(filter_var($ip,FILTER_VALIDATE_IP,FILTER_FLAG_NO_PRIV_RANGE|FILTER_FLAG_NO_RES_RANGE)===false) return false;
          return true;
      }

      private static function dnsResolvePublic(string $url): array {
          $p=parse_url($url); if(!$p||empty($p['host'])) return [];
          $host=strtolower(rtrim($p['host'],'.')); $port=(int)($p['port']??443); $out=[];
          foreach(self::resolveHost($host) as $ip) $out[]=str_contains($ip,':')?$host.':'.$port.':['.$ip.']':$host.':'.$port.':'.$ip;
          return $out;
      }

      private static function resolveHost(string $host): array {
          if(filter_var($host,FILTER_VALIDATE_IP)) return [$host];
          $out=[]; foreach(array_merge(@dns_get_record($host,DNS_A)?:[],@dns_get_record($host,DNS_AAAA)?:[]) as $r){ if(!empty($r['ip']))$out[]=$r['ip']; if(!empty($r['ipv6']))$out[]=$r['ipv6']; }
          return array_values(array_unique($out));
      }
          '''
              http = http.replace("\n}\n", insertion + "\n}\n", 1)
          write('app/Core/HttpClient.php', http)

          # 3) ChannelManager: one authoritative secure edit path.
          cm = read('app/Domain/ChannelManager.php')
          if 'public static function updateChannel(' not in cm:
              method = r'''

              public static function updateChannel(int $id, int $tenantId, string $name, string $platform, string $channelId, string $token, array $links, array $buttonConfig): array {
                  if ($id<=0 || $tenantId<=0 || trim($name)==='' || trim($token)==='') return ['success'=>false,'message'=>'اطلاعات کانال نامعتبر است.'];
                  $platform=AntiAbuse::normalizePlatform($platform); $channelId=AntiAbuse::normalizeChannelId($channelId); $token=trim($token);
                  if(!in_array($platform,['telegram','bale'],true) || $channelId==='') return ['success'=>false,'message'=>'پلتفرم یا شناسه کانال نامعتبر است.'];
                  $db=Bootstrap::getDB();
                  $current=self::getChannel($id,$tenantId); if(!$current) return ['success'=>false,'message'=>'کانال مورد نظر یافت نشد.'];
                  if(!str_starts_with($token, 'enc:v1:')) {
                      $test=self::testBotConnection($platform,$token); if(!$test['success']) return ['success'=>false,'message'=>'اتصال ربات قابل تأیید نیست؛ تغییر کانال متوقف شد.'];
                      $access=self::verifyBotChannelAccess($platform,$token,$channelId); if(!$access['success']) return ['success'=>false,'message'=>$access['message']];
                      $encrypted=SecretStore::encrypt($token);
                  } else {
                      return ['success'=>false,'message'=>'توکن رمزنگاری‌شده قابل ارسال مستقیم نیست.'];
                  }
