                  if($successes && $failures){$status='partial';}elseif($successes){$status='sent';}else{$status='failed';}
                  $db->prepare('UPDATE posts SET status=? WHERE id=? AND tenant_id=? AND status=\'sending\'')->execute([$status,$post_id,$tenant_id]);
