          ai = r'''    public function handleSaveAiSettingsAdmin(){
              $this->checkSuperAdmin(); if(!Csrf::validate($_POST['csrf_token']??null)){$this->setFlashMessage('خطای امنیتی!');$this->redirect('/hnnh');return;}
              $db=Bootstrap::getDB();
              $fields=['ai_global_provider','ai_global_model','ai_global_key','ai_global_url','ai_active_by_default'];
              foreach($fields as $f){
                  $val=$_POST[$f]??''; if($f==='ai_active_by_default'){$val=isset($_POST[$f])?'1':'0';}
                  if($f==='ai_global_key'){
                      $val=trim((string)$val);
                      if($val===''||$val==='••••••••'){$q=$db->prepare("SELECT key_value FROM settings WHERE tenant_id=0 AND key_name=? LIMIT 1");$q->execute([$f]);$val=(string)($q->fetchColumn()?:'');}
                      elseif($val!==''){$val=SecretStore::encrypt($val);}
