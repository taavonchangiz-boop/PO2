name: Build deployment archive
on:
  push:
    branches:
      - hardening/uiux-complete-2026-08
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find postyar-private -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build ZIP
        run: |
          rm -rf /tmp/package
          mkdir -p /tmp/package
          rsync -a --exclude='.git' --exclude='storage/logs/*' --exclude='storage/cache/*' ./ /tmp/package/PO2/
          cd /tmp/package
          zip -qr /tmp/PO2-hardened.zip PO2
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PO2-hardened
          path: /tmp/PO2-hardened.zip
          retention-days: 7
